<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>非公式応援ツール集</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #172018;
      background: #f7fbf8;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    a {
      color: inherit;
    }

    .hero {
      border-bottom: 1px solid #d8e6dc;
      background:
        linear-gradient(135deg, rgba(223, 246, 220, 0.92), rgba(238, 247, 255, 0.94) 58%, rgba(255, 248, 230, 0.9));
    }

    .hero-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
      align-items: center;
      gap: 32px;
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: 48px 20px 40px;
    }

    .label {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      margin: 0 0 14px;
      padding: 6px 10px;
      border: 1px solid rgba(15, 118, 110, 0.25);
      border-radius: 999px;
      color: #0f5f57;
      background: rgba(255, 255, 255, 0.72);
      font-size: 0.9rem;
      font-weight: 800;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(2.2rem, 8vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .lead {
      max-width: 36rem;
      margin-bottom: 0;
      color: #425247;
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.8;
    }

    .field-visual {
      position: relative;
      overflow: hidden;
      min-height: 224px;
      border-radius: 8px;
      background:
        repeating-linear-gradient(90deg, #37a66b 0 48px, #2c955f 48px 96px);
      box-shadow: 0 18px 45px rgba(29, 91, 57, 0.22);
    }

    .field-visual::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 8px;
    }

    .field-visual::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 108px;
      height: 108px;
      transform: translate(-50%, -50%);
      border: 3px solid rgba(255, 255, 255, 0.78);
      border-radius: 50%;
    }

    .goal-mark {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 44%;
      height: 54px;
      transform: translateX(-50%);
      border: 3px solid rgba(255, 255, 255, 0.84);
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
    }

    .spot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.22);
    }

    .content {
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: 34px 20px 48px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.9fr);
      gap: 28px;
      align-items: start;
    }

    .section-label {
      margin-bottom: 8px;
      color: #0f766e;
      font-size: 0.86rem;
      font-weight: 900;
    }

    h2 {
      margin-bottom: 14px;
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      letter-spacing: 0;
    }

    .tool-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tool-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 96px;
      padding: 18px 20px;
      border: 1px solid #cfe0d5;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(24, 72, 43, 0.1);
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .tool-link:hover {
      transform: translateY(-2px);
      border-color: #0f766e;
      box-shadow: 0 16px 34px rgba(24, 72, 43, 0.15);
    }

    .tool-link:focus-visible {
      outline: 4px solid rgba(14, 165, 233, 0.28);
      outline-offset: 4px;
    }

    .tool-title {
      display: block;
      margin-bottom: 6px;
      color: #172018;
      font-size: 1.12rem;
      font-weight: 900;
    }

    .tool-description {
      display: block;
      color: #53645a;
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .tool-arrow {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: #0f766e;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .notice {
      padding: 20px;
      border: 1px solid #d8e6dc;
      border-top: 5px solid #0f766e;
      border-radius: 8px;
      background: #ffffff;
    }

    .notice h2 {
      margin-bottom: 12px;
      font-size: 1.25rem;
    }

    .notice-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 1.2rem;
      color: #425247;
      line-height: 1.7;
    }

    .footer-note {
      margin: 32px 0 0;
      padding-top: 18px;
      border-top: 1px solid #d8e6dc;
      color: #647168;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      .hero-inner {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 34px 18px 30px;
      }

      .field-visual {
        min-height: 176px;
      }

      .content {
        padding: 28px 18px 40px;
      }

      .content-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .tool-link {
        min-height: 88px;
        padding: 16px;
      }
    }

    @media (max-width: 420px) {
      .tool-link {
        align-items: flex-start;
      }

      .tool-arrow {
        flex-basis: 38px;
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="label">個人制作・非公式</p>
        <h1>非公式応援ツール集</h1>
        <p class="lead">
          観戦まわりの小さな遊びと支援ツールを、少しずつ育てていく置き場です。
        </p>
      </div>
      <div class="field-visual" aria-hidden="true">
        <span class="goal-mark"></span>
        <span class="spot"></span>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="content-grid">
      <section aria-labelledby="published-title">
        <p class="section-label">公開中</p>
        <h2 id="published-title">遊べるコンテンツ</h2>
        <ul class="tool-list">
          <li>
            <a class="tool-link" href="./games/pk/index.html">
              <span>
                <span class="tool-title">PKゲーム Ver0.1</span>
                <span class="tool-description">5ラウンドのPK戦をブラウザだけで遊べます。</span>
              </span>
              <span class="tool-arrow" aria-hidden="true">&rarr;</span>
            </a>
          </li> 
<li>
  <a class="tool-link" href="./spots/vending-machines/index.html">
    <span>
      <span class="tool-title">パルセイロ応援自販機</span>
      <span class="tool-description">街で見つけたAC長野パルセイロ応援自販機を紹介しています。現在2か所掲載中。</span>
    </span>
    <span class="tool-arrow" aria-hidden="true">&rarr;</span>
  </a>
</li>
        </ul>
      </section>

      <section class="notice" aria-labelledby="notice-title">
        <h2 id="notice-title">注意</h2>
        <ul class="notice-list">
          <li>このサイトは個人制作の非公式サイトです。</li>
          <li>実在のクラブ、選手、団体とは関係ありません。</li>
          <li>公式情報は必ず公式サイトをご確認ください。</li>
        </ul>
      </section>
    </div>

    <p class="footer-note">
      今後、観戦支援ツールや初観戦ガイドなども追加していく予定です。
    </p>
  </main>

</body>
</html>
